<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Anfitrión - CasaNova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h2-color">Mis Propiedades</h2>
            <a href="/anfitrion/nueva-propiedad" class="btn btn-mi-color">
                <i class="bi bi-plus-circle me-2"></i>Nueva propiedad
            </a>
        </div>

        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

        <!-- TABLA DE PROPIEDADES -->
        <div class="table-responsive shadow rounded">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Título</th>
                        <th>Ciudad</th>
                        <th>Tipo</th>
                        <th>Precio</th>
                        <th>Operación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prop : ${propiedades}">
                        <td th:text="${prop.id_propiedad}"></td>
                        <td th:text="${prop.titulo}"></td>
                        <td th:text="${prop.ciudad}"></td>
                        <td th:text="${prop.tipo_propiedad}"></td>
                        <td>€<span th:text="${#numbers.formatDecimal(prop.precio_noche, 0, 'COMMA', 0, 'POINT')}"></span></td>
                        <td>
                            <span th:class="${prop.tipo_operacion == 'alquiler' ? 'badge bg-info' : 'badge bg-warning text-dark'}"
                                  th:text="${prop.tipo_operacion}"></span>
                        </td>
                        <td>
                            <a th:href="@{/anfitrion/editar/{id}(id=${prop.id_propiedad})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/anfitrion/reservas/{id}(id=${prop.id_propiedad})}"
                               class="btn btn-sm btn-outline-success me-1">
                                <i class="bi bi-calendar-check"></i>
                            </a>
                            <form th:action="@{/anfitrion/eliminar/{id}(id=${prop.id_propiedad})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar esta propiedad?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(propiedades)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            No tienes propiedades publicadas.
                            <a href="/anfitrion/nueva-propiedad">Publica la primera</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
