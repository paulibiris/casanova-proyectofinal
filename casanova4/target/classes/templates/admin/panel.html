<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - CasaNova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container-fluid my-4 px-4">
        <h2 class="h2-color mb-4">Panel de Administración</h2>

        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

        <!-- ESTADÍSTICAS -->
        <div class="row g-3 mb-5">
            <div class="col-md-4">
                <div class="card text-white bg-primary shadow text-center p-4">
                    <i class="bi bi-people-fill fs-1"></i>
                    <h3 th:text="${totalUsuarios}">0</h3>
                    <p class="mb-0">Usuarios registrados</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success shadow text-center p-4">
                    <i class="bi bi-house-fill fs-1"></i>
                    <h3 th:text="${totalPropiedades}">0</h3>
                    <p class="mb-0">Propiedades activas</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning shadow text-center p-4">
                    <i class="bi bi-calendar-check-fill fs-1"></i>
                    <h3 th:text="${totalReservas}">0</h3>
                    <p class="mb-0">Total de reservas</p>
                </div>
            </div>
        </div>

        <!-- TABLA USUARIOS -->
        <h4 class="mb-3">Usuarios</h4>
        <div class="table-responsive shadow rounded mb-5">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Tipo</th><th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id_usuario}"></td>
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.telefono}"></td>
                        <td>
                            <span th:class="${u.tipo.name() == 'admin' ? 'badge bg-danger' :
                                             u.tipo.name() == 'anfitrion' ? 'badge bg-info' : 'badge bg-secondary'}"
                                  th:text="${u.tipo}"></span>
                        </td>
                        <td>
                            <form th:action="@{/admin/usuarios/eliminar/{id}(id=${u.id_usuario})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar usuario?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- TABLA RESERVAS -->
        <h4 class="mb-3">Reservas</h4>
        <div class="table-responsive shadow rounded mb-5">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th><th>Propiedad</th><th>Usuario</th><th>Desde</th>
                        <th>Hasta</th><th>Total</th><th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${reservas}">
                        <td th:text="${r.id_reserva}"></td>
                        <td th:text="${r.id_propiedad}"></td>
                        <td th:text="${r.id_usuario}"></td>
                        <td th:text="${r.fecha_inicio}"></td>
                        <td th:text="${r.fecha_fin}"></td>
                        <td>€<span th:text="${#numbers.formatDecimal(r.precio_total, 0, 'COMMA', 2, 'POINT')}"></span></td>
                        <td>
                            <span th:class="${r.estado.name() == 'confirmada' ? 'badge bg-success' :
                                             r.estado.name() == 'cancelada' ? 'badge bg-danger' : 'badge bg-warning text-dark'}"
                                  th:text="${r.estado}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
