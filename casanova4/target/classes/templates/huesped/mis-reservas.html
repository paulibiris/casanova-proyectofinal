<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - CasaNova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container my-5">
        <h2 class="h2-color mb-4">Mis Reservas</h2>

        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>

        <div class="row g-4">
            <div th:each="r : ${reservas}" class="col-md-6 col-lg-4">
                <div class="card shadow h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title">Reserva #<span th:text="${r.id_reserva}"></span></h5>
                            <span th:class="${r.estado.name() == 'confirmada' ? 'badge bg-success' :
                                             r.estado.name() == 'cancelada' ? 'badge bg-danger' : 'badge bg-warning text-dark'}"
                                  th:text="${r.estado}"></span>
                        </div>
                        <p><i class="bi bi-house me-2"></i>Propiedad #<span th:text="${r.id_propiedad}"></span></p>
                        <p><i class="bi bi-calendar3 me-2"></i>
                            <span th:text="${r.fecha_inicio}"></span> →
                            <span th:text="${r.fecha_fin}"></span>
                        </p>
                        <p class="precio">€<span th:text="${#numbers.formatDecimal(r.precio_total, 0, 'COMMA', 2, 'POINT')}"></span></p>
                        <p class="text-muted small">Reservado el <span th:text="${r.fecha_reserva}"></span></p>

                        <!-- Cancelar si está pendiente -->
                        <form th:if="${r.estado.name() == 'pendiente'}"
                              th:action="@{/huesped/cancelar/{id}(id=${r.id_reserva})}"
                              method="post"
                              onsubmit="return confirm('¿Cancelar esta reserva?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                <i class="bi bi-x-circle me-1"></i>Cancelar reserva
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(reservas)}" class="col-12 text-center py-5">
                <i class="bi bi-calendar-x fs-1 text-muted"></i>
                <p class="text-muted mt-3">No tienes reservas todavía.</p>
                <a href="/propiedades/alquiler" class="btn btn-mi-color">Ver propiedades</a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
