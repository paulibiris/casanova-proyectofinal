<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquilar - CasaNova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>
    <div th:replace="~{fragments :: loginModal}"></div>

    <div class="container my-5">
        <h2 class="h2-color mb-4">Propiedades en Alquiler</h2>

        <!-- FILTROS -->
        <div class="p-4 mb-4 rounded shadow-sm seccion-color">
            <form action="/propiedades/alquiler" method="get" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="ciudad" class="form-control" placeholder="Ciudad...">
                </div>
                <div class="col-md-3">
                    <select name="tipo_propiedad" class="form-select">
                        <option value="">Tipo de propiedad</option>
                        <option>Casa</option>
                        <option>Apartamento</option>
                        <option>Chalet</option>
                        <option>Atico</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" name="precioMin" class="form-control" placeholder="Precio mín.">
                </div>
                <div class="col-md-2">
                    <input type="number" name="precioMax" class="form-control" placeholder="Precio máx.">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-mi-color w-100">Filtrar</button>
                </div>
            </form>
        </div>

        <!-- LISTADO -->
        <div class="row g-4">
            <div th:each="prop : ${propiedades}" class="col-md-4">
                <div class="card shadow h-100">
                    <img src="/img/casa3.jpg" class="card-img-top img-same-height" alt="Propiedad">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${prop.titulo}"></h5>
                        <p class="card-text text-muted">
                            <i class="bi bi-geo-alt"></i>
                            <span th:text="${prop.ciudad + ', ' + prop.pais}"></span>
                        </p>
                        <p class="card-text">
                            <span th:text="${prop.capacidad}"></span> personas ·
                            <span th:text="${prop.tipo_propiedad}"></span>
                        </p>
                        <p class="precio mt-auto">
                            €<span th:text="${#numbers.formatDecimal(prop.precio_noche, 0, 'COMMA', 0, 'POINT')}"></span>
                        </p>
                        <a th:href="@{/propiedades/{id}(id=${prop.id_propiedad})}"
                           class="btn btn-mi-color w-100">Ver detalles</a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(propiedades)}" class="col-12 text-center py-5">
                <i class="bi bi-house-x fs-1 text-muted"></i>
                <p class="text-muted mt-3">No se encontraron propiedades con esos criterios.</p>
                <a href="/propiedades/alquiler" class="btn btn-mi-color">Ver todas</a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
