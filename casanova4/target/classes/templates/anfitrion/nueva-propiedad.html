<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Propiedad - CasaNova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .img-option { cursor: pointer; border: 3px solid transparent; border-radius: 10px; overflow: hidden; transition: border-color .2s; }
        .img-option:hover { border-color: #8B6914; }
        .img-option.seleccionada { border-color: #8B6914; box-shadow: 0 0 0 3px rgba(139,105,20,.3); }
        .img-option img { height: 110px; object-fit: cover; width: 100%; display: block; }
        .img-option .nombre { font-size: .75rem; text-align: center; padding: 4px; background: #f8f4ee; }
    </style>
</head>
<body>
    <div th:replace="~{fragments :: navbar}"></div>

    <div class="container my-5" style="max-width: 750px;">
        <div class="card shadow p-4">
            <h3 class="mb-4 h2-color">Publicar nueva propiedad</h3>

            <form action="/anfitrion/nueva-propiedad" method="post">
                <!-- Campo oculto que guarda el nombre del archivo elegido -->
                <input type="hidden" name="foto" id="fotoSeleccionada" value="default.jpg">

                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label">Título *</label>
                        <input type="text" name="titulo" class="form-control" required placeholder="Ej: Apartamento moderno en el centro">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3" placeholder="Describe la propiedad..."></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dirección *</label>
                        <input type="text" name="direccion" class="form-control" required placeholder="Calle y número">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ciudad *</label>
                        <input type="text" name="ciudad" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">País *</label>
                        <input type="text" name="pais" class="form-control" value="España" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Precio (€) *</label>
                        <input type="number" name="precio_noche" class="form-control" step="0.01" min="0" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Capacidad (personas) *</label>
                        <input type="number" name="capacidad" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo de operación *</label>
                        <select name="tipo_operacion" class="form-select" required>
                            <option value="alquiler">Alquiler</option>
                            <option value="compra">Venta</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo de propiedad *</label>
                        <select name="tipo_propiedad" class="form-select" required>
                            <option>Casa</option>
                            <option>Apartamento</option>
                            <option>Chalet</option>
                            <option>Atico</option>
                        </select>
                    </div>

                    <!-- SELECTOR DE IMAGEN -->
                    <div class="col-12">
                        <label class="form-label">Selecciona una imagen *</label>

                        <!-- Sin imágenes disponibles -->
                        <div th:if="${#lists.isEmpty(imagenesDisponibles)}" class="alert alert-warning">
                            No hay imágenes en <code>static/img/</code>. Añade archivos .jpg, .png o .webp a esa carpeta y reinicia.
                        </div>

                        <!-- Grid de imágenes -->
                        <div th:unless="${#lists.isEmpty(imagenesDisponibles)}" class="row g-2">
                            <div th:each="img : ${imagenesDisponibles}" class="col-6 col-md-3">
                                <div class="img-option" th:data-nombre="${img}" onclick="seleccionarImagen(this)">
                                    <img th:src="@{/img/{nombre}(nombre=${img})}" th:alt="${img}">
                                    <div class="nombre" th:text="${img}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-text mt-2">
                            Imagen seleccionada: <strong id="textoSeleccion">ninguna</strong>
                        </div>
                    </div>

                    <div class="col-12 d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-mi-color px-4">Publicar propiedad</button>
                        <a href="/anfitrion/panel" class="btn btn-outline-secondary px-4">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function seleccionarImagen(el) {
            document.querySelectorAll('.img-option').forEach(o => o.classList.remove('seleccionada'));
            el.classList.add('seleccionada');
            const nombre = el.dataset.nombre;
            document.getElementById('fotoSeleccionada').value = nombre;
            document.getElementById('textoSeleccion').textContent = nombre;
        }
    </script>
</body>
</html>
